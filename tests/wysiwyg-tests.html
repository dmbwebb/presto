<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Presto WYSIWYG Editing Tests</title>
    <link rel="stylesheet" href="../engine/webslides.css">
    <link rel="stylesheet" href="../engine/themes/academic.css">
    <script defer src="../engine/webslides.js"></script>
    <script defer src="../presto/wysiwyg.js"></script>
    <style>
        #test-results {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 2147483200;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 90vh;
            overflow-y: auto;
            min-width: 420px;
        }
        #test-results .pass { color: #4ade80; }
        #test-results .fail { color: #f87171; }
        #test-results .section { color: #60a5fa; font-weight: bold; margin-top: 8px; }
        #test-results .summary { margin-top: 12px; padding-top: 8px; border-top: 1px solid #555; font-weight: bold; }
    </style>
</head>
<body>

<!-- Authored slide bodies live in templates so tests can compare serialization
     output against the browser-canonical form of the authored source. -->
<template id="authored-content"><h2>Content Slide</h2>
    <p id="para">Hello <strong>world</strong> paragraph.</p>
    <ul id="list">
        <li id="li-one">First bullet</li>
        <li data-step="1" id="li-step">Stepped bullet</li>
    </ul>
    <p id="bullet-target">Turn this into a bullet</p>
    <div class="text-box" id="overlap-back"
         style="position: absolute; left: 760px; top: 600px; width: 220px;">Earlier reveal</div>
    <div class="text-box" id="overlap-front" data-step="1"
         style="position: absolute; left: 760px; top: 600px; width: 220px;">Later reveal</div>
    <div class="box" id="box"><div class="box-title">Box title</div><p id="box-para">Box body</p></div>
    <p data-class="emphasized:2" id="classed">Class step target</p></template>

<template id="authored-table"><h2>Tables</h2>
    <div class="table-container" id="ext-table" data-table-src="data:text/html,%3Ctable%3E%3Ctbody%3E%3Ctr%3E%3Ctd%3Eext%20cell%3C%2Ftd%3E%3C%2Ftr%3E%3Ctr%20data-step%3D%221%22%3E%3Ctd%3Estep%20row%3C%2Ftd%3E%3C%2Ftr%3E%3C%2Ftbody%3E%3C%2Ftable%3E"></div>
    <div class="table-container" id="inline-table"><table><tbody><tr><td>inline cell</td></tr></tbody></table></div></template>

<template id="authored-media"><h2>Media</h2>
    <img id="inline-svg-img" data-inline class="figure" alt="inline figure"
         src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Ccircle%20id='wys-dot'%20cx='5'%20cy='5'%20r='4'/%3E%3C/svg%3E">
    <img id="plain-img" alt="plain figure"
         src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Crect%20width='10'%20height='10'/%3E%3C/svg%3E">
    <img id="leak-svg-img" data-inline alt="leak figure"
         src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20class='svglite'%20viewBox='0%200%2010%2010'%3E%3Crect%20width='10'%20height='10'/%3E%3C/svg%3E"></template>

<template id="authored-katex"><h2>Math</h2>
    <p id="math-para">Inline <span class="katex"><span class="katex-mathml"><math><semantics><mrow></mrow><annotation encoding="application/x-tex">x^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">x2</span></span> math.</p>
    <span class="katex-display"><span class="katex"><span class="katex-mathml"><math><semantics><mrow></mrow><annotation encoding="application/x-tex">\int_0^1 f</annotation></semantics></math></span></span></span></template>

<template id="authored-extra"><h2>Extra Slide</h2>
    <p id="extra-para">Extra paragraph body</p>
    <p id="extra-step" data-step="1">Stepped extra line</p>
    <p id="nudge-target">Nudge target</p>
    <p id="clamp-target">Clamp target</p>
    <p id="styled-fmt" style="font-weight: 700; font-style: italic; text-decoration-line: underline;">Preformatted text</p>
    <div id="bare-block"><span id="bare-inner">bare block content</span></div></template>

<template id="authored-extra2"><h2>Extra Slide Two</h2>
    <p id="extra2-para">Second extra paragraph</p></template>

<div class="ws-deck">
    <section class="slide title" id="s-title">
        <h1>WYSIWYG Test Deck</h1>
        <p class="subtitle" id="subtitle">Direct manipulation</p>
        <aside class="notes" id="title-notes">Speaker notes for the title slide.</aside>
    </section>
    <section class="slide content" id="s-content"></section>
    <section class="slide content" id="s-table"></section>
    <section class="slide content" id="s-media"></section>
    <section class="slide content" id="s-katex"></section>
    <section class="slide content" id="s-extra"></section>
    <section class="slide content" id="s-extra2"></section>
</div>
<div id="ws-footer">
    <span id="ws-footer-left">WYSIWYG Tests</span>
    <span id="ws-footer-right"></span>
</div>
<div id="test-results"></div>

<script>
// Populate slides from the authored templates before the engine initializes.
['content', 'table', 'media', 'katex', 'extra', 'extra2'].forEach(function (name) {
    document.getElementById('s-' + name).innerHTML =
        document.getElementById('authored-' + name).innerHTML;
});
</script>

<script>
window.addEventListener('load', function () { runAllTests(); });

var passed = 0, failed = 0, total = 0;
var resultsEl = null;

function log(cls, text) {
    var div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    resultsEl.appendChild(div);
}

function section(name) { log('section', name); }

function assert(name, condition, detail) {
    total++;
    if (condition) {
        passed++;
        log('pass', '✓ ' + name);
    } else {
        failed++;
        log('fail', '✗ ' + name + (detail !== undefined ? ' — ' + detail : ''));
        console.error('FAIL: ' + name, detail);
    }
}

function assertEqual(name, actual, expected) {
    assert(name, actual === expected, 'got ' + JSON.stringify(actual) + ', expected ' + JSON.stringify(expected));
}

function assertClose(name, actual, expected, tol) {
    tol = tol === undefined ? 1.5 : tol;
    assert(name, typeof actual === 'number' && Math.abs(actual - expected) <= tol,
        'got ' + actual + ', expected ' + expected + ' ±' + tol);
}

function tick(ms) { return new Promise(function (r) { setTimeout(r, ms || 0); }); }

function waitFor(cond, timeoutMs) {
    var deadline = Date.now() + (timeoutMs || 5000);
    return new Promise(function (resolve, reject) {
        (function poll() {
            if (cond()) return resolve();
            if (Date.now() > deadline) return reject(new Error('waitFor timeout'));
            setTimeout(poll, 40);
        })();
    });
}

function canonical(templateId) {
    return document.getElementById(templateId).innerHTML;
}

function mouse(type, target, clientX, clientY, opts) {
    var init = Object.assign({
        bubbles: true, cancelable: true, view: window,
        clientX: clientX || 0, clientY: clientY || 0, button: 0
    }, opts || {});
    target.dispatchEvent(new MouseEvent(type, init));
}

function keydown(target, key, opts) {
    var init = Object.assign({ bubbles: true, cancelable: true, key: key }, opts || {});
    target.dispatchEvent(new KeyboardEvent('keydown', init));
}

function keyup(target, key, opts) {
    var init = Object.assign({ bubbles: true, cancelable: true, key: key }, opts || {});
    target.dispatchEvent(new KeyboardEvent('keyup', init));
}

function translateX(el) {
    return parseFloat((el.style.translate || '0').split(/\s+/)[0]) || 0;
}

function center(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function clickToSelect(el) {
    var c = center(el);
    mouse('mousedown', el, c.x, c.y);
    mouse('mouseup', el, c.x, c.y);
    mouse('click', el, c.x, c.y);
}

function dblclickOn(el, x, y) {
    var c = x === undefined ? center(el) : { x: x, y: y };
    mouse('mousedown', el, c.x, c.y);
    mouse('mouseup', el, c.x, c.y);
    mouse('dblclick', el, c.x, c.y);
}

function slideScaleFor(slide) {
    return slide.getBoundingClientRect().width / 1280;
}

// A committed text box (a box nobody types into is discarded, BACKLOG 9).
function makeBox(x, y, text) {
    var box = window.__prestoWysiwyg.addTextBox(x, y);
    document.execCommand('insertText', false, text || 'Box');
    window.__prestoWysiwyg.endTextEdit();
    return box;
}

// Drive a full resize gesture through a handle: mousedown on the handle (which
// runs startResize), then a single document mousemove past the ±2px threshold,
// then mouseup (onResizeEnd). Mirrors the real capture-phase event flow.
function resizeGesture(handleKind, dxClient, dyClient, opts) {
    var handle = document.querySelector('.presto-wysiwyg-handle[data-handle="' + handleKind + '"]');
    if (!handle) return false;
    var c = center(handle);
    mouse('mousedown', handle, c.x, c.y, opts);
    mouse('mousemove', document, c.x + dxClient, c.y + dyClient, opts);
    mouse('mouseup', document, c.x + dxClient, c.y + dyClient, opts);
    return true;
}

function handleCenter(kind) {
    var h = document.querySelector('.presto-wysiwyg-handle[data-handle="' + kind + '"]');
    var r = h.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2,
             visible: h.classList.contains('visible') };
}

var messages = [];
function messagesOfType(type) {
    return messages.filter(function (m) { return m.type === type; });
}
function lastMessage(type) {
    var list = messagesOfType(type);
    return list.length ? list[list.length - 1] : null;
}

async function runAllTests() {
    resultsEl = document.getElementById('test-results');
    var W = window.__prestoWysiwyg;

    try {
        await waitFor(function () {
            return window.WS && WS.slides && WS.slides.length === 7 &&
                document.querySelector('#ext-table table') &&
                document.querySelector('#s-media svg[data-ws-original-img]');
        });
    } catch (e) {
        assert('deck initialized with async content', false, String(e));
        finish();
        return;
    }

    section('Setup');
    assert('wysiwyg API exposed', !!W && W.version === 1);
    W.onMessage = function (msg) { messages.push(msg); };
    localStorage.setItem('presto-hidden-step-opacity', '0');
    W.enable();
    await waitFor(function () { return W.state().enabled; });
    assert('enable() marks body', document.body.classList.contains('presto-wysiwyg-on'));
    assert('engine stashed original img', !!document.querySelector('#s-media svg[data-ws-original-img]'));
    assert('engine stashed original table html', document.getElementById('ext-table').hasAttribute('data-ws-original-html'));

    // ===== The old dark top-right panel is gone (PDF, <>, Step, Opacity) =====
    section('Light chrome: no dark panel');
    assert('no top-right step/opacity panel', !document.getElementById('presto-step-visibility'));
    assert('no in-page HTML source toggle', !document.getElementById('presto-source-toggle'));
    assert('no in-page PDF button', !document.getElementById('presto-pdf-export'));
    var chromeCss = document.getElementById('presto-wysiwyg-style').textContent;
    assert('no dark #252526 chrome colours remain', chromeCss.indexOf('#252526') < 0 && chromeCss.indexOf('#3c3c3c') < 0);
    assert('chrome styles use the shared accent token', chromeCss.indexOf('var(--p-accent') >= 0);

    // PDF export and the source pane moved to the native toolbar; the API stays.
    section('HTML source and PDF export API');
    messages.length = 0;
    W.toggleSourceSidebar();
    assert('toggleSourceSidebar() requests the native sidebar', !!lastMessage('toggleSourceSidebar'));
    W.setSourceSidebarVisible(true);
    assert('state reports source sidebar open', W.state().sourceSidebarVisible === true);
    W.setSourceSidebarVisible(false);
    assert('state reports source sidebar closed', W.state().sourceSidebarVisible === false);
    messages.length = 0;
    assert('exportPDF() posts the shared native export request', W.exportPDF() === true && !!lastMessage('exportPDFRequested'));
    W.setPDFExportAvailable(false);
    messages.length = 0;
    assert('a busy export refuses a duplicate request', W.exportPDF() === false && !lastMessage('exportPDFRequested'));
    W.setPDFExportAvailable(true);
    assert('state reports export available again', W.state().pdfExportAvailable === true);

    // ===== Ghosted reveal steps =====
    section('Reveal ghosting');
    WS.goToSlide(1, 0);
    await tick(50);
    var stepLi = document.getElementById('li-step');
    var ghostStyle = getComputedStyle(stepLi);
    assertEqual('hidden step restores its saved opacity at step 0', ghostStyle.opacity, '0');
    assertEqual('fully hidden step blocks pointer events', ghostStyle.pointerEvents, 'none');
    assertEqual('ghost setting restored off from storage', W.state().hiddenStepOpacity, 0);
    var ghostEvents = [];
    document.addEventListener('presto:ghostfuture', function (e) { ghostEvents.push(e.detail.on); });
    messages.length = 0;
    W.setGhostFuture(true, { silent: true });
    await tick(20);
    assertEqual('setGhostFuture(true) shows hidden steps at 33%', getComputedStyle(stepLi).opacity, '0.33');
    assertEqual('ghosted step accepts pointer events again', getComputedStyle(stepLi).pointerEvents, 'auto');
    assertEqual('ghost setting persists', localStorage.getItem('presto-hidden-step-opacity'), '0.33');
    assert('a silent change (edit chrome or shell) posts nothing to Swift', !lastMessage('ghostFutureChanged'));
    assertEqual('setGhostFuture announces presto:ghostfuture for the step strip', ghostEvents.join(','), 'true');
    WS.goToSlide(1, 1);
    await tick(50);
    assertEqual('revealed step is fully opaque', getComputedStyle(stepLi).opacity, '1');
    WS.goToSlide(1, 0);
    await tick(20);

    // ⇧⌘O typed into the page toggles it and tells Swift (menu checkmark).
    keydown(document.body, 'O', { metaKey: true, shiftKey: true });
    assertEqual('cmd-shift-O hides future steps', W.state().hiddenStepOpacity, 0);
    var ghostMsg = lastMessage('ghostFutureChanged');
    assert('cmd-shift-O posts ghostFutureChanged {on:false}', !!ghostMsg && ghostMsg.on === false);
    keydown(document.body, 'o', { metaKey: true, shiftKey: true });
    assertEqual('cmd-shift-O restores ghosted future steps', W.state().hiddenStepOpacity, 0.33);
    assert('second cmd-shift-O posts {on:true}', lastMessage('ghostFutureChanged').on === true);

    // ===== Selection model =====
    section('Selection');
    var para = document.getElementById('para');
    assertEqual('pickSelectable: paragraph', W.pickSelectable(para), para);
    assertEqual('pickSelectable: text inside strong -> paragraph', W.pickSelectable(para.querySelector('strong')), para.querySelector('strong').closest('p'));
    assertEqual('pickSelectable: li', W.pickSelectable(document.getElementById('li-one')), document.getElementById('li-one'));
    assertEqual('pickSelectable: box title -> box child', W.pickSelectable(document.querySelector('#box .box-title')).id, 'box');

    clickToSelect(para);
    assert('click selects paragraph', W.state().hasSelection && para.classList.contains('presto-wysiwyg-selected'));
    assert('selection posts editing state', lastMessage('wysiwygEditingState') && lastMessage('wysiwygEditingState').hasSelection === true);
    assert('mousedown posts wysiwygWillEdit', messagesOfType('wysiwygWillEdit').length > 0);
    var toolbar = document.getElementById('presto-wysiwyg-toolbar');
    assert('toolbar visible on selection', toolbar && toolbar.classList.contains('visible'));

    // Click empty slide area deselects
    var slide1 = WS.slides[1];
    var slideRect = slide1.getBoundingClientRect();
    mouse('mousedown', slide1, slideRect.left + 30, slideRect.bottom - 12);
    mouse('mouseup', slide1, slideRect.left + 30, slideRect.bottom - 12);
    assert('click on empty slide area deselects', !W.state().hasSelection);
    assert('toolbar hidden after deselect', !toolbar.classList.contains('visible'));

    // Hover affordance
    var boxPara = document.getElementById('box-para');
    mouse('mousemove', boxPara, center(boxPara).x, center(boxPara).y);
    assert('hover marks selectable element', boxPara.classList.contains('presto-wysiwyg-hover'));
    mouse('mousemove', slide1, slideRect.left + 30, slideRect.bottom - 12);
    assert('hover clears off elements', !boxPara.classList.contains('presto-wysiwyg-hover'));

    // Escape deselects
    clickToSelect(para);
    keydown(document.body, 'Escape');
    assert('Escape deselects', !W.state().hasSelection);

    // Engine click navigation suppressed
    WS.goToSlide(1, 0);
    await tick(20);
    var stepBefore = WS.currentStep;
    var rightSide = { x: slideRect.right - 40, y: slideRect.top + 200 };
    mouse('mousedown', para, rightSide.x, rightSide.y);
    mouse('mouseup', para, rightSide.x, rightSide.y);
    mouse('click', para, rightSide.x, rightSide.y);
    assertEqual('engine click-navigation suppressed', WS.currentStep, stepBefore);

    section('Overlapping selection');
    var overlapFront = document.getElementById('overlap-front');
    var overlapBack = document.getElementById('overlap-back');
    // overlap-front is a future step (data-step=1); at step 0 the object
    // visible right now outranks its ghost.
    clickToSelect(overlapFront);
    assert('first click selects the object visible at the current step', overlapBack.classList.contains('presto-wysiwyg-selected'));
    clickToSelect(overlapFront);
    assert('second click cycles to the ghosted future-step object', overlapFront.classList.contains('presto-wysiwyg-selected'));
    assert('overlap hint explains how to select behind',
        document.getElementById('presto-wysiwyg-hint').textContent.indexOf('click again') >= 0);
    clickToSelect(overlapFront);
    assert('another click cycles back to the visible object', overlapBack.classList.contains('presto-wysiwyg-selected'));
    var overlapPoint = center(overlapFront);
    mouse('mousedown', overlapFront, overlapPoint.x, overlapPoint.y);
    mouse('mousemove', document, overlapPoint.x + 20, overlapPoint.y + 10, { buttons: 1 });
    mouse('mouseup', document, overlapPoint.x + 20, overlapPoint.y + 10);
    assert('dragging after cycling moves only the selected visible object',
        !!overlapBack.style.translate && !overlapFront.style.translate);
    W.deselect();

    // With both objects revealed, the topmost wins again.
    WS.goToSlide(1, 1);
    await tick(30);
    clickToSelect(overlapFront);
    assert('with both revealed, first click selects the top object', overlapFront.classList.contains('presto-wysiwyg-selected'));
    clickToSelect(overlapFront);
    assert('with both revealed, clicking cycles to the object behind', overlapBack.classList.contains('presto-wysiwyg-selected'));
    W.deselect();

    // At 0% opacity the invisible future step is not selectable at all.
    WS.goToSlide(1, 0);
    await tick(20);
    keydown(document.body, 'O', { metaKey: true, shiftKey: true });
    assertEqual('shortcut hides ghosts for the exclusion check', W.state().hiddenStepOpacity, 0);
    assertEqual('invisible future step blocks pointer events', getComputedStyle(overlapFront).pointerEvents, 'none');
    clickToSelect(overlapFront);
    assert('click over an invisible ghost selects the visible object', overlapBack.classList.contains('presto-wysiwyg-selected'));
    clickToSelect(overlapFront);
    assert('cycling never reaches an invisible ghost', overlapBack.classList.contains('presto-wysiwyg-selected') && !overlapFront.classList.contains('presto-wysiwyg-selected'));
    keydown(document.body, 'O', { metaKey: true, shiftKey: true });
    assertEqual('ghosts restored after the exclusion check', W.state().hiddenStepOpacity, 0.33);
    W.deselect();

    // ===== Atoms =====
    section('Atomic elements');
    WS.goToSlide(2, 0);
    await tick(30);
    var extTable = document.getElementById('ext-table');
    var extCell = extTable.querySelector('td');
    clickToSelect(extCell);
    assertEqual('click inside external table selects container', W.state().selectedTag, 'div');
    assert('external table container is selected', extTable.classList.contains('presto-wysiwyg-selected'));
    assert('external table cannot be text edited', !W.canTextEdit(extTable));
    keydown(document.body, 'Escape');

    var inlineCell = document.querySelector('#inline-table td');
    assert('inline-source table cell can be text edited', W.canTextEdit(inlineCell.closest('#inline-table') ? inlineCell : inlineCell));

    WS.goToSlide(3, 0);
    await tick(30);
    var inlinedSvg = document.querySelector('#s-media svg[data-ws-original-img]');
    clickToSelect(inlinedSvg);
    assertEqual('inlined svg selects as atom', W.state().selectedTag, 'svg');
    assert('svg cannot be text edited', !W.canTextEdit(inlinedSvg));
    keydown(document.body, 'Escape');

    WS.goToSlide(4, 0);
    await tick(30);
    var katex = document.querySelector('#math-para .katex');
    clickToSelect(katex.querySelector('.katex-html') || katex);
    assert('katex selects as atom', W.state().hasSelection && document.querySelector('.presto-wysiwyg-selected').classList.contains('katex'));
    assert('katex cannot be text edited', !W.canTextEdit(katex));
    keydown(document.body, 'Escape');

    // ===== Text editing =====
    section('Text editing');
    WS.goToSlide(1, 0);
    await tick(30);
    messages.length = 0;
    dblclickOn(para);
    assert('dblclick starts text editing', W.state().textEditing);
    assertEqual('contenteditable applied', para.getAttribute('contenteditable'), 'true');
    assert('editing state posted', lastMessage('wysiwygEditingState') && lastMessage('wysiwygEditingState').textEditing === true);

    // Engine keyboard navigation suppressed while editing
    var idxBefore = WS.currentIndex;
    keydown(para, 'ArrowRight');
    assertEqual('arrow key does not navigate while editing', WS.currentIndex, idxBefore);

    document.execCommand('insertText', false, 'EDITED ');
    keydown(para, 'Escape');
    assert('Escape ends text editing', !W.state().textEditing);
    assert('element still selected after editing', W.state().hasSelection);
    assert('contenteditable removed', !para.hasAttribute('contenteditable'));
    assert('typed text landed in slide', para.textContent.indexOf('EDITED') >= 0);
    var changeMsg = lastMessage('wysiwygChanged');
    assert('text commit posted wysiwygChanged', !!changeMsg);
    assertEqual('commit targets slide 1', changeMsg && changeMsg.index, 1);
    assert('commit payload contains typed text', changeMsg && changeMsg.html.indexOf('EDITED') >= 0);
    assert('commit payload has no artifacts', changeMsg && changeMsg.html.indexOf('contenteditable') < 0 && changeMsg.html.indexOf('presto-wysiwyg') < 0);

    // Save confirmation drives the status chip
    var status = document.getElementById('presto-wysiwyg-status');
    W.saveConfirmed(changeMsg.saveId);
    assert('saveConfirmed shows Saved chip', status.classList.contains('saved') && status.classList.contains('visible'));

    // Line breaks: Enter inserts <br> inside a paragraph
    dblclickOn(para);
    document.execCommand('insertText', false, 'X');
    keydown(para, 'Enter');
    assert('Enter inserts line break in paragraph', para.innerHTML.indexOf('<br>') >= 0);
    keydown(para, 'Escape');

    // Paste is plain-text only
    dblclickOn(para);
    var pasteWorked = false;
    try {
        var dt = new DataTransfer();
        dt.setData('text/plain', 'PASTEDTEXT');
        var pasteEvent = new ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dt });
        para.dispatchEvent(pasteEvent);
        pasteWorked = para.textContent.indexOf('PASTEDTEXT') >= 0;
    } catch (e) { pasteWorked = false; }
    assert('paste inserts plain text', pasteWorked);
    assert('paste does not insert markup', para.innerHTML.indexOf('PASTEDTEXT</b>') < 0);
    keydown(para, 'Escape');
    keydown(document.body, 'Escape');

    // ===== Undo / redo =====
    section('Undo / redo');
    var undoDepthBefore = W.state().undoDepth;
    assert('edits accumulated undo history', undoDepthBefore >= 3);
    var textBeforeUndo = para.textContent;
    assert('undo returns true', W.undo());
    assert('undo restored earlier content', para.textContent !== textBeforeUndo || document.getElementById('para').textContent !== textBeforeUndo);
    var paraAfterUndo = document.getElementById('para');
    assert('redo returns true', W.redo());
    assertEqual('redo reapplies content', document.getElementById('para').textContent, textBeforeUndo);
    assert('undo posts save for restored state', messagesOfType('wysiwygChanged').length >= 3);

    // Undo via keyboard with selection

    // ===== data-reveal="each" shortcut (contract C2) =====
    // The engine expands the shortcut into per-item data-step attributes marked
    // data-ws-auto-step; the serializer must hand back the authored list only.
    section('Reveal shortcut serialization');
    var authoredReveal = '<ul data-reveal="each" data-reveal-start="2"><li>Alpha</li>' +

    autoItems.forEach(function (li, i) {
        li.setAttribute('data-step', String(2 + i));
        li.setAttribute('data-ws-auto-step', '');
        if (i === 0) li.classList.add('ws-visible');
    });
    var revealSer = W.serializeSection(revealSection);
    assertEqual('auto-step list serializes back to the authored shortcut', revealSer, canonicalReveal);
    assert('serialized list has no data-ws-auto-step marker', revealSer.indexOf('data-ws-auto-step') < 0);
    assert('explicit author step survives next to auto steps', revealSer.indexOf('<li data-step="7">Explicit</li>') >= 0);
    assert('serializing does not strip the live generated steps',
        revealSection.querySelectorAll('[data-ws-auto-step][data-step]').length === autoItems.length);

    W.deselect();

    // ===== Serialization: idempotent, non-mutating, table + attr cleanup =====

    WS.goToSlide(2, 1);
    await tick(30);
    var sTableEl = document.getElementById('s-table');
    var ser1 = W.serializeSection(sTableEl);

    assert('serialized output has no empty class attributes', ser1.indexOf('class=""') < 0);
    assert('serialized output has no empty style attributes', ser1.indexOf('style=""') < 0);

    var innerTable = extC.querySelector('table');
    innerTable.style.transform = 'scale(0.5)';
    // The engine also writes overflow/position on the container and
    // transform-origin on the table when fitting; its refit reset omits them,
    // so the serializer must strip all of them (nothing engine-written leaks).
    extC.style.overflow = 'hidden';
    extC.style.position = 'relative';
    innerTable.style.transformOrigin = 'top left';
    var serClean = W.serializeSection(sTableEl);
    assert('serialize strips the table-container runtime height', serClean.indexOf('777px') < 0);
    assert('serialize strips the inner table transform', serClean.indexOf('scale(0.5)') < 0);
    assert('serialize strips the table-container overflow', serClean.indexOf('overflow') < 0);
    assert('serialize strips the table-container position', serClean.indexOf('position: relative') < 0);
    assert('serialize strips the inner table transform-origin', serClean.indexOf('transform-origin') < 0);
    assertEqual('serialize leaves the live table-container height untouched', extC.style.height, '777px');
    extC.style.removeProperty('height');
    innerTable.style.removeProperty('transform');
    extC.style.removeProperty('overflow');
    extC.style.removeProperty('position');
    innerTable.style.removeProperty('transform-origin');
    WS.goToSlide(3, 0);
    await tick(20);
    var svgBefore = document.querySelector('#s-media svg[data-ws-original-img]');

        document.querySelector('#s-media svg[data-ws-original-img]') === svgBefore);

    // ===== Navigation + watchdog =====
    section('Navigation & watchdog');
    WS.goToSlide(5, 0);
    await tick(20);
    W.select('#extra-para');

    await tick(20);
    assert('selection on a still-connected element survives same-slide navigation',
        W.state().hasSelection && document.querySelector('.presto-wysiwyg-selected') === document.getElementById('extra-para'));
    W.deselect();
    WS.goToSlide(6, 0);
    await tick(20);
    W.select('#extra2-para');

    WS.slides[6].innerHTML = '<h2>Swapped</h2><p>replaced content</p>';
    await tick(700);
    assert('watchdog clears a detached selection within ~700ms', !W.state().hasSelection);
    assert('watchdog clears text editing after an external DOM swap', !W.state().textEditing);

    // ===== Editing chrome owns its own input (regression) =====
    // Real-input bugs found by the Chrome E2E harness: handles/toolbar live
    // outside the slide, so the capture-phase handlers must claim them via
    // isChrome() instead of treating them as deselect-clicks, and keys typed
    // into chrome controls must never reach the selection key model.
    section('Chrome input ownership');
    WS.goToSlide(3, 0);
    await tick(20);
    W.select('svg[data-ws-original-img]');
    assert('image selected with visible resize handle', W.state().hasSelection &&
        document.querySelector('.presto-wysiwyg-handle[data-handle="se"]').classList.contains('visible'));
    var seHandle = document.querySelector('.presto-wysiwyg-handle[data-handle="se"]');
    var hc = center(seHandle);
    mouse('mousedown', seHandle, hc.x, hc.y);
    assert('mousedown on a resize handle keeps the selection', W.state().hasSelection);
    mouse('mouseup', seHandle, hc.x, hc.y);
    W.deselect();
    WS.goToSlide(1, 0);
    await tick(20);
    W.select('#para');
    var fontInput = document.getElementById('presto-wysiwyg-font-size');
    keydown(fontInput, 'Enter');
    assert('Enter typed into the font input does not start a text session',
        !W.state().textEditing && W.state().hasSelection);
    keydown(fontInput, 'Escape');
    assert('Escape typed into the font input does not deselect the element',
        W.state().hasSelection);
    keydown(fontInput, 'Backspace');
    assert('Backspace typed into the font input does not delete the element',
        !!document.getElementById('para'));
    W.deselect();

    // ===== Data-safety audit fixes =====

    // --- 1. Session owner capture: cross-slide navigation mid-session saves to
    //        the OWNING slide, never the navigated-to slide. ---
    section('Session owner capture (cross-slide nav)');
    WS.goToSlide(6, 0);
    await tick(20);
    W.deselect();
    var slide6DepthBefore = W.state().undoDepth;
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();
    messages.length = 0;
    W.beginTextEdit('#extra-para');
    document.getElementById('extra-para').appendChild(document.createTextNode(' OWNERTAG'));
    WS.goToSlide(6, 0);   // cross-slide navigation while a session is live
    await tick(30);
    assert('cross-slide navigation ended the text session', !W.state().textEditing);
    var ownerSave = lastMessage('wysiwygChanged');
    assertEqual('typed text saved to the OWNING slide index (5)', ownerSave && ownerSave.index, 5);
    assert('save payload carries the text typed on the owning slide',
        ownerSave && ownerSave.html.indexOf('OWNERTAG') >= 0);
    assert('the text actually landed on slide 5 in the DOM',
        document.getElementById('extra-para').textContent.indexOf('OWNERTAG') >= 0);
    assertEqual('the navigated-to slide (6) history was not poisoned', W.state().undoDepth, slide6DepthBefore);
    W.deselect();

    // --- 2. Nested-atom protection + katex serializer defense ---
    section('Nested-atom protection in text sessions');
    WS.goToSlide(4, 0);
    await tick(30);
    W.deselect();
    var mathPara = document.getElementById('math-para');
    assert('math paragraph can be text edited', W.canTextEdit(mathPara));
    W.beginTextEdit('#math-para');
    var nestedKatex = mathPara.querySelector('.katex');
    assertEqual('nested katex is locked non-editable during the session',
        nestedKatex.getAttribute('contenteditable'), 'false');
    assert('locked atom carries the cleanup marker', nestedKatex.hasAttribute('data-pw-atom-lock'));
    W.endTextEdit();
    assert('atom lock removed after the session ends',
        !nestedKatex.hasAttribute('contenteditable') && !nestedKatex.hasAttribute('data-pw-atom-lock'));
    var mathSer = W.serializeSection(document.getElementById('s-katex'));
    assert('serialized math after a no-op session has no katex soup', mathSer.indexOf('katex') < 0);
    assert('serialized math still restores inline $x^2$', mathSer.indexOf('$x^2$') >= 0);
    W.deselect();
    // Serializer defense: orphan katex (annotation destroyed) never reaches source.
    var orphanSection = document.createElement('section');
    orphanSection.className = 'slide content';
    orphanSection.innerHTML = '<p>Broken <span class="katex"><span class="katex-html">x</span></span> math</p>';
    var orphanSer = W.serializeSection(orphanSection);
    assert('orphan katex (no annotation) is stripped from serialized source', orphanSer.indexOf('katex') < 0);
    assert('orphan katex strip leaves the surrounding prose',
        orphanSer.indexOf('Broken') >= 0 && orphanSer.indexOf('math') >= 0);

    // --- 3. KaTeX move/format round-trip via a style wrapper, idempotent ---
    section('KaTeX move/format round-trip');
    function makeInlineKatex(styleAttr) {
        var sec = document.createElement('section');
        sec.className = 'slide content';
        sec.innerHTML = '<p>Pre <span class="katex"' + (styleAttr ? ' style="' + styleAttr + '"' : '') +
            '><span class="katex-mathml"><math><semantics><mrow></mrow>' +
            '<annotation encoding="application/x-tex">x^2</annotation></semantics></math></span>' +
            '<span class="katex-html" aria-hidden="true">x2</span></span> post</p>';
        return sec;
    }
    var movedSer = W.serializeSection(makeInlineKatex('translate: 24px 0px'));
    assert('moved inline equation serializes with a style wrapper',
        movedSer.indexOf('<span style="translate: 24px 0px">$x^2$</span>') >= 0);
    assert('moved equation source carries the authored TeX', movedSer.indexOf('$x^2$') >= 0);
    assert('moved equation source has no katex markup', movedSer.indexOf('katex') < 0);
    // edit -> serialize -> re-render -> edit -> serialize is stable (no nesting).
    var pass1 = W.serializeSection(makeInlineKatex('color: red'));
    var reRendered = document.createElement('section');
    reRendered.className = 'slide content';
    reRendered.innerHTML = '<p>Pre <span style="color: red"><span class="katex">' +
        '<span class="katex-mathml"><math><semantics><mrow></mrow>' +
        '<annotation encoding="application/x-tex">x^2</annotation></semantics></math></span>' +
        '</span></span> post</p>';
    var pass2 = W.serializeSection(reRendered);
    assertEqual('katex serialization is idempotent across re-render', pass2, pass1);
    assert('re-rendered wrapper does not nest a second wrapper',
        pass2.indexOf('<span style="color: red"><span') < 0);
    assert('idempotent output keeps a single styled wrapper',
        pass2.indexOf('<span style="color: red">$x^2$</span>') >= 0);
    var dispSec = document.createElement('section');
    dispSec.className = 'slide content';
    dispSec.innerHTML = '<span class="katex-display" style="translate: 0px 12px"><span class="katex">' +
        '<span class="katex-mathml"><math><semantics><mrow></mrow>' +
        '<annotation encoding="application/x-tex">\\int_0^1 f</annotation></semantics></math></span></span></span>';
    var dispSer = W.serializeSection(dispSec);
    assert('moved display equation serializes with a div wrapper carrying the style',
        dispSer.indexOf('<div style="translate: 0px 12px">$$\\int_0^1 f$$</div>') >= 0);
    assert('display equation wrapper has no katex markup', dispSer.indexOf('katex') < 0);

    // --- 4. External-replacement history invalidation ---
    section('External replacement history invalidation');
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();
    W.select('#nudge-target');
    W.nudge(3, 0);
    assert('slide 5 has undo history before external replace', W.state().undoDepth > 0);
    assert('notifyExternalReplace returns true for a valid index', W.notifyExternalReplace(5) === true);
    assertEqual('notifyExternalReplace cleared the slide history', W.state().undoDepth, 0);
    assert('undo after external replace is a no-op (returns false)', W.undo() === false);
    W.beginTextEdit('#nudge-target');
    document.getElementById('nudge-target').appendChild(document.createTextNode(' STALE'));
    messages.length = 0;
    W.notifyExternalReplace(5);
    assert('external replace ended the live session', !W.state().textEditing);
    assert('external replace did NOT post a save of the stale content',
        messagesOfType('wysiwygChanged').length === 0);
    W.deselect();

    // --- 5. commitActiveSession ---
    section('commitActiveSession');
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();
    assert('commitActiveSession returns false with no live session', W.commitActiveSession() === false);
    W.beginTextEdit('#clamp-target');

    assert('commitActiveSession ended the text session', !W.state().textEditing);
    assert('commitActiveSession keeps the element selected', W.state().hasSelection);
    var commitSave = lastMessage('wysiwygChanged');
    assert('commitActiveSession flushed the typed text to a save',
        commitSave && commitSave.html.indexOf('COMMITNOW') >= 0);
    W.deselect();

    // --- 6a. Engine-injected section-nav chrome stripped from source ---
    section('Serializer: section-nav chrome stripped');
    var hdr = document.createElement('section');
    hdr.className = 'slide section-header';
    hdr.innerHTML = '<div class="ws-section-eyebrow">Part I</div><h1>Methods</h1>' +
        '<ul class="section-toc"><li class="active"><span class="ws-toc-label">1. Methods</span></li>' +
        '<li><span class="ws-toc-label">2. Results</span></li></ul>';

        hdrSer.indexOf('section-toc') < 0 && hdrSer.indexOf('ws-toc-label') < 0);
    assert('engine-injected eyebrow is stripped from source', hdrSer.indexOf('ws-section-eyebrow') < 0);
    assert('authored heading survives the strip', hdrSer.indexOf('<h1>Methods</h1>') >= 0);
    var manualToc = document.createElement('section');
    manualToc.className = 'slide section-header';
    manualToc.innerHTML = '<h1>Agenda</h1><ul class="section-toc"><li>Intro</li><li>Body</li></ul>';
    var manualSer = W.serializeSection(manualToc);
    assert('a manually authored section-toc (no ws-toc-label) is preserved',
        manualSer.indexOf('section-toc') >= 0 && manualSer.indexOf('Intro') >= 0);

    // --- 6d. Translate robustness for %/em/calc/3-value ---
    section('Translate robustness: non-px units');
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();
    var pctBox = makeBox(100, 100);
    W.select(pctBox);
    pctBox.style.translate = '50% 10px';
    assert('nudge composes a %/unit translate via calc (returns true)', W.nudge(2, 0) === true);
    assertEqual('percentage translate composed, not px-corrupted', pctBox.style.translate, 'calc(50% + 2px) 10px');
    assert('nudge refuses a calc() translate', W.nudge(2, 0) === false);
    assertEqual('calc translate left untouched by the refused nudge', pctBox.style.translate, 'calc(50% + 2px) 10px');
    pctBox.style.translate = '10px 20px 5px';
    assert('nudge refuses a 3-value (z-axis) translate', W.nudge(2, 0) === false);
    assertEqual('3-value translate untouched (z preserved)', pctBox.style.translate, '10px 20px 5px');
    pctBox.style.translate = '10px 10px';
    assert('nudge still moves a plain px translate', W.nudge(2, 0) === true);
    assertEqual('px translate accumulated normally', pctBox.style.translate, '12px 10px');
    W.deselect();
    var pctAbs = makeBox(0, 0);
    pctAbs.style.left = '50%';
    pctAbs.style.top = '2em';
    W.select(pctAbs);
    assert('duplicate of a %/em positioned element returns true', W.duplicateSelected());
    var pctCopy = document.querySelector('.presto-wysiwyg-selected');
    assertEqual('duplicate composes % left with calc (no px corruption)', pctCopy.style.left, 'calc(50% + 24px)');
    assertEqual('duplicate composes em top with calc', pctCopy.style.top, 'calc(2em + 24px)');
    W.deleteSelected();
    W.deselect();

    // --- 7a. Lazy snapshot source is correct across undo/redo ---
    section('Snapshot source (lazy) correctness');
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();
    W.select('#extra-para');
    W.setFontSize(30);

    W.undo();
    var undoSave = lastMessage('wysiwygChanged');

        W.serializeCurrentSlide(), directSer);
    assert('undo/redo saves via lazy source are artifact-free',
        undoSave.html.indexOf('presto-wysiwyg') < 0 && redoSave.html.indexOf('contenteditable') < 0);
    W.deselect();

    // --- 7b. Sidebar thumbnail rebuilds are coalesced to gesture-idle ---
    section('Sidebar thumbnail coalescing');
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();

    var prevThumb = window.updatePrestoEditSidebarThumbnail;

    W.select('#extra-para');

    await tick(60);

    var callsBeforeNav = thumbCalls;

    assert('navigation flushed the pending thumbnail synchronously', thumbCalls > callsBeforeNav);
    window.updatePrestoEditSidebarThumbnail = prevThumb;

    // ===== Keyboard model + toolbar UX (this flow) =====
    section('⌘←/→ navigate, never nudge');
    WS.goToSlide(5, 0);
    await tick(20);
    var navEl = document.getElementById('nudge-target');
    navEl.style.removeProperty('translate');

    messages.length = 0;

    assertEqual('⌘→ does not nudge the element', navEl.style.translate || '', transBefore);
    assert('⌘→ drops the selection (lets navigation propagate)', !W.state().hasSelection);
    assertEqual('⌘→ writes nothing to disk', messagesOfType('wysiwygChanged').length, 0);
    W.select('#nudge-target');
    keydown(document.body, 'ArrowLeft', { metaKey: true });
    assert('⌘← also deselects instead of nudging', !W.state().hasSelection);

    section('Nudge coalescing (one undo + one save per burst)');
    W.select('#nudge-target');
    var burstEl = document.getElementById('nudge-target');
    var x0 = translateX(burstEl);
    var depth0 = W.state().undoDepth;
    messages.length = 0;
    keydown(document.body, 'ArrowRight');
    keydown(document.body, 'ArrowRight');
    keydown(document.body, 'ArrowRight');
    assertEqual('three rapid nudges each move the element (2px steps)', translateX(burstEl), x0 + 6);
    assertEqual('a nudge burst pushes no undo step until it ends', W.state().undoDepth, depth0);
    assertEqual('a nudge burst posts no save until it ends', messagesOfType('wysiwygChanged').length, 0);
    keyup(document.body, 'ArrowRight');
    assertEqual('arrow keyup flushes the burst as ONE undo step', W.state().undoDepth, depth0 + 1);
    assertEqual('arrow keyup flushes the burst as ONE save', messagesOfType('wysiwygChanged').length, 1);
    W.undo();

    assertEqual('undo after a burst restores the pre-burst position',
        translateX(document.getElementById('nudge-target')), x0);

    WS.goToSlide(5, 0);
    await tick(20);
    W.select('#extra-para');
    keydown(document.body, 'a');
    assert('a printable key on a selected text element starts a session', W.state().textEditing);
    assert('replace-on-type selected the whole block for replacement',
        !getSelection().isCollapsed && getSelection().toString().length > 0);
    keydown(document.getElementById('extra-para'), 'Escape');
    keydown(document.body, 'Escape');
    W.select('#extra-para');
    keydown(document.body, 'b', { metaKey: true });
    assert('⌘B does not start a replace-on-type session', !W.state().textEditing);
    W.deselect();
    WS.goToSlide(3, 0);
    await tick(20);
    var atomSvg = document.querySelector('#s-media svg[data-ws-original-img]');
    W.select(atomSvg);
    keydown(document.body, 'x');
    assert('a printable key on an atom does not start a session', !W.state().textEditing);
    W.deselect();

    section('Toolbar stickiness');
    WS.goToSlide(5, 0);
    await tick(20);
    W.select('#clamp-target');
    var stbar = document.getElementById('presto-wysiwyg-toolbar');
    var pos0 = { top: stbar.style.top, left: stbar.style.left };
    var sbr = stbar.getBoundingClientRect();
    mouse('mousemove', stbar, sbr.left + sbr.width / 2, sbr.top + sbr.height / 2);
    W.setFontSize(80);
    assertEqual('toolbar top holds while the pointer is over it', stbar.style.top, pos0.top);
    assertEqual('toolbar left holds while the pointer is over it', stbar.style.left, pos0.left);
    W.select('#extra-para');
    assert('a new selection re-anchors the toolbar (forced)',
        stbar.style.top !== pos0.top || stbar.style.left !== pos0.left);
    W.deselect();

    section('Font field: blur applies, arrows step, invalid reverts');
    WS.goToSlide(5, 0);
    await tick(20);
    W.select('#extra-para');
    W.setFontSize(30);
    var fi = document.getElementById('presto-wysiwyg-font-size');
    fi.value = '48';
    fi.dispatchEvent(new FocusEvent('blur'));
    assertEqual('font field blur applies the typed value', document.getElementById('extra-para').style.fontSize, '48px');
    keydown(fi, 'ArrowUp');
    assertEqual('font field ArrowUp steps +1 live', document.getElementById('extra-para').style.fontSize, '49px');
    keydown(fi, 'ArrowDown', { shiftKey: true });
    assertEqual('font field Shift+ArrowDown steps -10 live', document.getElementById('extra-para').style.fontSize, '39px');
    keyup(fi, 'ArrowDown');
    fi.value = 'not a number';
    fi.dispatchEvent(new FocusEvent('blur'));
    assertEqual('invalid font entry reverts the field to the real size', fi.value, '39');
    W.deselect();

    section('Double / triple-click text selection');
    WS.goToSlide(1, 0);
    await tick(20);
    var wpara = document.getElementById('para');
    // Synthetic input bypasses browser hit-testing. Wait until the slide
    // transition exposes the paragraph before testing rendered text selection.
    await waitFor(function () { return getComputedStyle(wpara).visibility === 'visible'; });
    var wr = wpara.getBoundingClientRect();
    dblclickOn(wpara, wr.left + 8, wr.top + wr.height / 2);
    assert('double-click starts a text session', W.state().textEditing);
    assert('double-click does not select the whole block (word or caret)',
        getSelection().toString() !== wpara.textContent);
    mouse('click', wpara, wr.left + 8, wr.top + wr.height / 2, { detail: 3 });
    assertEqual('triple-click selects the whole block',
        getSelection().toString().replace(/\s+/g, ' ').trim(),
        wpara.textContent.replace(/\s+/g, ' ').trim());
    keydown(wpara, 'Escape');
    keydown(document.body, 'Escape');

    section('Inline B/I/U at a collapsed caret');
    WS.goToSlide(5, 0);
    await tick(20);
    var cbEl = document.getElementById('extra-para');
    cbEl.style.removeProperty('font-weight');
    var cbr = cbEl.getBoundingClientRect();
    dblclickOn(cbEl, cbr.left + 8, cbr.top + cbr.height / 2);
    assert('session started for collapsed-caret bold', W.state().textEditing);
    getSelection().collapseToStart();
    assert('caret is collapsed inside the session', getSelection().isCollapsed);
    W.toggleBold();
    assertEqual('collapsed-caret ⌘B sets typing style, not block weight',
        document.getElementById('extra-para').style.fontWeight, '');
    keydown(cbEl, 'Escape');
    keydown(document.body, 'Escape');
    // ===== Resize: full handle set, 2D math, aspect, anchoring, table refit =====
    // Drives real handle gestures (mousedown handle -> document mousemove ->
    // mouseup). The guides module is NOT loaded here, so these exercise the raw
    // resize math; guides integration is covered by chrome-wysiwyg-e2e.js.

    section('Resize: handle geometry');
    WS.goToSlide(3, 0);
    await tick(30);
    W.deselect();
    W.select('svg[data-ws-original-img]');
    await tick(10);
    var rImg = document.querySelector('svg[data-ws-original-img]');
    var geomRect = rImg.getBoundingClientRect();
    var seH = handleCenter('se'), eH = handleCenter('e'), sH = handleCenter('s'), wH = handleCenter('w');
    assert('all four resize handles are visible', seH.visible && eH.visible && sH.visible && wH.visible);
    assert('SE handle sits at the bottom-right corner',
        Math.abs(seH.x - geomRect.right) < 3 && Math.abs(seH.y - geomRect.bottom) < 3, JSON.stringify(seH));
    assert('E handle sits at the right edge, vertically centered',
        Math.abs(eH.x - geomRect.right) < 3 && Math.abs(eH.y - (geomRect.top + geomRect.height / 2)) < 3, JSON.stringify(eH));
    assert('S handle sits at the bottom edge, horizontally centered',
        Math.abs(sH.x - (geomRect.left + geomRect.width / 2)) < 3 && Math.abs(sH.y - geomRect.bottom) < 3, JSON.stringify(sH));
    assert('W handle sits at the left edge, vertically centered',
        Math.abs(wH.x - geomRect.left) < 3 && Math.abs(wH.y - (geomRect.top + geomRect.height / 2)) < 3, JSON.stringify(wH));
    W.deselect();

    section('Resize: 2D corner (SE) at two zoom scales');
    WS.goToSlide(5, 0);
    await tick(30);
    W.deselect();
    var slide5 = WS.slides[5];
    var scale1 = slideScaleFor(slide5);
    var boxA = makeBox(120, 120);
    boxA.style.boxSizing = 'border-box';
    boxA.style.padding = '0';
    boxA.style.borderWidth = '0';
    boxA.style.width = '240px';
    boxA.style.height = '120px';
    W.select(boxA);
    await tick(10);
    resizeGesture('se', 40, 30);
    assertClose('SE grows width by dx/scale (scale ~1)', parseFloat(boxA.style.width) - 240, 40 / scale1, 2);
    assertClose('SE grows height by dy/scale (scale ~1)', parseFloat(boxA.style.height) - 120, 30 / scale1, 2);
    // Force a second, different scale on the active slide and repeat: the
    // client->slide-px conversion must compensate so the same client delta maps
    // to a proportionally larger slide-px delta.
    var savedTransform = slide5.style.transform;
    slide5.style.transform = 'translate(-50%, -50%) scale(0.5)';
    await tick(10);
    var scale2 = slideScaleFor(slide5);
    assert('the forced second scale differs from the first', Math.abs(scale2 - scale1) > 0.1, { scale1: scale1, scale2: scale2 });
    var wA1 = parseFloat(boxA.style.width), hA1 = parseFloat(boxA.style.height);
    W.select(boxA);
    await tick(10);
    resizeGesture('se', 40, 30);
    assertClose('SE grows width by dx/scale at a second zoom', parseFloat(boxA.style.width) - wA1, 40 / scale2, 3);
    assertClose('SE grows height by dy/scale at a second zoom', parseFloat(boxA.style.height) - hA1, 30 / scale2, 3);
    slide5.style.transform = savedTransform;
    W.deselect();

    section('Resize: media aspect-lock + Shift frees the ratio');
    WS.goToSlide(3, 0);
    await tick(30);
    W.deselect();
    var img = document.querySelector('svg[data-ws-original-img]');
    var scaleM = slideScaleFor(WS.slides[3]);
    W.select(img);
    await tick(10);
    var imgW0 = img.getBoundingClientRect().width / scaleM;
    resizeGesture('se', 50, 12);
    assertEqual('media corner drag keeps height:auto (aspect-locked)', img.style.height, 'auto');
    assertClose('media corner drag grows width by dx/scale', parseFloat(img.style.width) - imgW0, 50 / scaleM, 3);
    resizeGesture('se', 20, 40, { shiftKey: true });
    assert('Shift-corner on media sets an explicit height (ratio freed)',
        img.style.height !== 'auto' && parseFloat(img.style.height) > 0, img.style.height);
    W.deselect();

    section('Resize: E width-only + S height-only (no cross-axis jitter)');
    WS.goToSlide(5, 0);
    await tick(30);
    W.deselect();
    var scaleB = slideScaleFor(WS.slides[5]);
    var boxB = makeBox(150, 150);
    boxB.style.boxSizing = 'border-box';
    boxB.style.padding = '0';
    boxB.style.borderWidth = '0';
    boxB.style.width = '200px';
    boxB.style.height = '100px';
    W.select(boxB);
    await tick(10);
    resizeGesture('e', 40, 25);   // vertical jitter must be ignored on E
    assertClose('E handle grows width by dx/scale', parseFloat(boxB.style.width) - 200, 40 / scaleB, 2);
    assertEqual('E handle leaves the explicit height untouched', boxB.style.height, '100px');
    var wBeforeS = parseFloat(boxB.style.width);
    resizeGesture('s', 30, 40);   // horizontal jitter must be ignored on S
    assertClose('S handle grows height by dy/scale', parseFloat(boxB.style.height) - 100, 40 / scaleB, 2);
    assertEqual('S handle does not change width (no horizontal jitter)', parseFloat(boxB.style.width), wBeforeS);
    W.deselect();

    section('Resize: W handle keeps the right edge fixed');
    WS.goToSlide(5, 0);
    await tick(30);
    W.deselect();
    var scaleW = slideScaleFor(WS.slides[5]);
    // Absolute element: horizontal anchor via `left`.
    var boxC = makeBox(300, 400);
    boxC.style.boxSizing = 'border-box';
    boxC.style.padding = '0';
    boxC.style.borderWidth = '0';
    boxC.style.width = '200px';
    W.select(boxC);
    await tick(10);
    var rightBeforeC = boxC.getBoundingClientRect().right;
    resizeGesture('w', -40, 0);   // drag the left edge leftward -> wider
    assertClose('W drag keeps the right edge fixed (absolute)', boxC.getBoundingClientRect().right - rightBeforeC, 0, 2);
    assertClose('W drag grows width by |dx|/scale (absolute)', parseFloat(boxC.style.width) - 200, 40 / scaleW, 2);
    assertClose('W drag moves the left edge left by |dx|/scale (absolute)', 300 - parseFloat(boxC.style.left), 40 / scaleW, 2);
    W.deselect();
    // Translate-positioned (non-absolute) element: horizontal anchor via translate.
    var boxD = makeBox(0, 0);
    boxD.style.boxSizing = 'border-box';
    boxD.style.padding = '0';
    boxD.style.borderWidth = '0';
    boxD.style.position = 'static';
    boxD.style.removeProperty('left');
    boxD.style.removeProperty('top');
    boxD.style.width = '160px';
    boxD.style.translate = '100px 40px';
    W.select(boxD);
    await tick(10);
    var rightBeforeD = boxD.getBoundingClientRect().right;
    resizeGesture('w', -30, 0);
    assertClose('W on a translate element keeps the right edge fixed', boxD.getBoundingClientRect().right - rightBeforeD, 0, 2);
    assertClose('W on a translate element shifted translate x left by |dx|/scale', 100 - parseFloat(boxD.style.translate), 30 / scaleW, 2);
    W.deselect();

    section('Resize: minimum size clamp (24px)');
    WS.goToSlide(5, 0);
    await tick(20);
    W.deselect();
    var boxE = makeBox(200, 200);
    boxE.style.boxSizing = 'border-box';
    boxE.style.padding = '0';
    boxE.style.borderWidth = '0';
    boxE.style.width = '120px';
    boxE.style.height = '80px';
    W.select(boxE);
    await tick(10);
    resizeGesture('se', -500, -500);   // shrink far past zero
    assertEqual('width clamps to the 24px minimum', parseFloat(boxE.style.width), 24);
    assertEqual('height clamps to the 24px minimum', parseFloat(boxE.style.height), 24);
    W.deselect();

    section('Resize: table container triggers WS.refitTables; saved source fit-free');
    WS.goToSlide(2, 0);
    await tick(50);
    W.deselect();
    var refitCalls = 0;
    var origRefit = WS.refitTables;
    WS.refitTables = function () { refitCalls++; return origRefit.apply(WS, arguments); };
    var tableC = document.getElementById('inline-table');
    W.select(tableC);
    await tick(10);
    assert('table container is resizable (handle shown)', handleCenter('se').visible);
    messages.length = 0;
    resizeGesture('e', 60, 0);
    await tick(10);
    assert('resizing a table container called WS.refitTables (live table re-fits)', refitCalls >= 1, refitCalls);
    var tableSave = lastMessage('wysiwygChanged');
    assert('table resize committed a save', !!tableSave);
    assert('saved source carries the new container width', tableSave && /width:\s*\d+px/.test(tableSave.html),
        tableSave && tableSave.html.slice(0, 200));
    assert('saved source has no engine fit styles (transform/overflow)',
        tableSave && tableSave.html.indexOf('transform') < 0 && tableSave.html.indexOf('overflow') < 0,
        tableSave && tableSave.html.slice(0, 300));
    WS.refitTables = origRefit;
    W.deselect();

    section('Resize: saved source after an image resize is clean');
    WS.goToSlide(3, 0);
    await tick(30);
    W.deselect();
    W.select('svg[data-ws-original-img]');
    await tick(10);
    messages.length = 0;
    resizeGesture('se', 40, 0);
    await tick(10);
    var imgSave = lastMessage('wysiwygChanged');
    assert('image resize committed a save', !!imgSave);
    assert('image resize serialized back to <img> with width, no chrome/atoms',
        imgSave && imgSave.html.indexOf('<img') >= 0 && /width:\s*\d+px/.test(imgSave.html) &&
        imgSave.html.indexOf('presto-wysiwyg') < 0 && imgSave.html.indexOf('data-ws-original-img') < 0,
        imgSave && imgSave.html.slice(0, 300));
    W.deselect();

    // ===== Disable =====
    section('Disable');
    W.disable();
    assert('disable clears body marker', !document.body.classList.contains('presto-wysiwyg-on'));
    assert('disable drops selection', !W.state().hasSelection);
    var idxBeforeDisabled = WS.currentStep;
    clickToSelect(document.getElementById('para'));
    assert('clicks no longer select when disabled', !W.state().hasSelection);
    W.enable();
    assert('re-enable works', W.state().enabled);

    finish();
}

function finish() {
    var summary = document.createElement('div');
    summary.className = 'summary ' + (failed === 0 ? 'pass' : 'fail');
    summary.textContent = passed + '/' + total + ' passed';
    resultsEl.appendChild(summary);
    window.WYSIWYG_TEST_RESULTS = { passed: passed, failed: failed, total: total };
    console.log('WYSIWYG_TESTS: ' + passed + '/' + total + ' passed');
}
</script>
</body>
</html>
