<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>WebSlides External Table Step Tests</title>
    <link rel="stylesheet" href="../engine/webslides.css">
    <link rel="stylesheet" href="../engine/themes/academic.css">
    <script defer src="../engine/webslides.js"></script>
</head>
<body>
<div class="ws-deck">
    <section class="slide title">
        <h1>External Table Step Test</h1>
    </section>
    <section class="slide content" id="table-slide">
        <h2>Loaded Table Steps</h2>
        <div class="table-container"
             data-table-src="data:text/html,%3Ctable%3E%3Ctbody%3E%3Ctr%20data-step%3D%222%22%3E%3Ctd%3ELoaded%20step%3C%2Ftd%3E%3C%2Ftr%3E%3C%2Ftbody%3E%3C%2Ftable%3E"></div>
    </section>
</div>
<div id="ws-footer">
    <span id="ws-footer-left">External Table Step Tests</span>
    <span id="ws-footer-right"></span>
</div>
<div id="test-results"></div>
<script>
window.addEventListener('load', function () {
    var ready = window.WS && WS.ready && typeof WS.ready.then === 'function'
        ? WS.ready
        : new Promise(function (resolve) { setTimeout(resolve, 800); });
    ready.then(function () {
        var slide = document.getElementById('table-slide');
        var maxStep = WS.slideSteps.get(slide);
        var initial = {
            index: WS.currentIndex,
            step: WS.currentStep,
            maxStep: maxStep,
            loadedRows: slide.querySelectorAll('table tr').length,
            visibleLoadedStep: slide.querySelector('[data-step="2"]')?.classList.contains('ws-visible') || false
        };
        WS.goToSlide(1, 2);
        var after = {
            index: WS.currentIndex,
            step: WS.currentStep,
            maxStep: WS.slideSteps.get(slide),
            loadedRows: slide.querySelectorAll('table tr').length,
            visibleLoadedStep: slide.querySelector('[data-step="2"]')?.classList.contains('ws-visible') || false
        };
        var passed = initial.maxStep === 2 &&
            initial.loadedRows === 1 &&
            initial.visibleLoadedStep === false &&
            after.index === 1 &&
            after.step === 2 &&
            after.maxStep === 2 &&
            after.loadedRows === 1 &&
            after.visibleLoadedStep === true;
        var results = { passed: passed, initial: initial, after: after };
        window.TABLE_STEP_TEST_RESULTS = results;
        document.getElementById('test-results').textContent = (passed ? 'TABLE_STEP_TESTS: passed ' : 'TABLE_STEP_TESTS: failed ') + JSON.stringify(results);
        console.log('TABLE_STEP_TESTS: ' + (passed ? 'passed ' : 'failed ') + JSON.stringify(results));
    });
});
</script>
</body>
</html>
