<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <style>text{font-family:Lato, 'Helvetica Neue', Arial, sans-serif;} .guide{stroke:#d33;stroke-width:1;}</style>
  <!-- red crosshairs mark each label's anchor point -->
  <g class="guides">
    <line class="guide" x1="40" y1="60" x2="1060" y2="60"/>
    <line class="guide" x1="80" y1="30" x2="80" y2="90"/>
    <line class="guide" x1="550" y1="30" x2="550" y2="90"/>
    <line class="guide" x1="1020" y1="30" x2="1020" y2="90"/>
    <line class="guide" x1="40" y1="160" x2="1060" y2="160"/>
    <line class="guide" x1="550" y1="130" x2="550" y2="190"/>
    <line class="guide" x1="40" y1="250" x2="1060" y2="250"/>
  </g>
  <text id="m-start" x="80" y="60" font-size="28" fill="#2F3037">Slope $\beta_1$ start</text>
  <text id="m-middle" x="550" y="60" font-size="28" fill="#2464b4" text-anchor="middle">$\hat\mu = \bar{Y}_{it}$</text>
  <text id="m-end" x="1020" y="60" font-size="28" font-weight="700" fill="#e0612a" text-anchor="end">bold $\tau^2$ end</text>
  <text id="m-baseline" x="550" y="160" font-size="28" text-anchor="middle" dominant-baseline="middle">centred $\alpha + \beta t$ label</text>
  <text id="m-dy" x="80" y="250" dy="0.35em" font-size="24" fill="#6F747C">dy shifted $x_i$ text</text>
  <text id="m-halo" x="700" y="250" font-size="26" fill="#1b9e77" stroke="white" stroke-width="6" paint-order="stroke" stroke-linejoin="round">halo $\delta$ <tspan font-weight="700">bold tspan</tspan></text>
  <text id="m-rotated" x="40" y="480" font-size="22" fill="#6F747C" text-anchor="middle" transform="rotate(-90 40 480)">effect $\theta$ (SD)</text>
  <g data-step="1">
    <text id="m-frac" x="120" y="380" font-size="28" fill="#5e3c99">share $\frac{1}{2}$ and $\sqrt{n}$</text>
  </g>
  <text id="m-frac-step" x="560" y="380" font-size="28" data-step="2">ratio $\frac{a}{b}$ at step 2</text>
  <text id="m-stat" x="120" y="470" font-size="26">loss $\stat{pct_fadeout}$, n $=$ <tspan data-stat="n_analyses">N</tspan></text>
  <text id="m-color" x="560" y="470" font-size="26">$\color{#B01E2F}{\alpha} + \color{#7A9A01}{\beta}$ coloured</text>
  <text id="m-dollar" x="120" y="530" font-size="24">cost \$5 to \$10, no math</text>
  <text id="m-plain" x="560" y="530" font-size="24">plain label untouched</text>
  <text id="m-error" x="900" y="530" font-size="20">bad $\frac{1$ tex</text>
  <text id="m-tspan-lines" x="900" y="380" font-size="22" text-anchor="middle"><tspan x="900" dy="0">first line</tspan><tspan x="900" dy="1.3em">$\gamma$ second</tspan></text>
</svg>
